<!DOCTYPE html>
<html lang="fr">
<head>
    
    <title>Connexion</title>
    <link rel="icon" href="static/photo/arrière personnage.jpeg" type="image/png">
    <link rel ="stylesheet" href ="{{ url_for ('static', filename='style2.css')}}"> 


    <meta name="viewport" content="width=device-width, initial-scale=0.5">

    <style>
        .foot{
           
            text-decoration: underline;

        }
        h1{
            
            text-align: center; /* Centre le texte horizontalement */
            margin-top: 0;
            margin-bottom:40px ; /* Supprime les marges par défaut */
            font-family: 'Times New Roman', Times, serif;
            font-size: 100px;
        }
    </style>
</head>
<body background="static/photo/chateau.jpeg">
    <h1 > Philorama </h1>
    <div class="Connexion">
        <h2 class="white">Connexion</h2>
        <form action="{{ url_for('login') }}" method="POST">
            <input  class="black" type="text" name="username" placeholder="Nom d'utilisateur" required>
            <input  class="black" type="password" name="password" placeholder="Mot de passe" required>
            <button class="black"  type="submit">Se connecter</button>
        </form>
    </div>
    <!-- Section principale -->
    <p class="white">{{message}}</p>
    

    <!-- Pied de page -->
    <footer >
        <p>&copy; <img class="foot" src="static/photo/dauphin.png" > 2025 Philorama. Tous droits réservés.</p>
    </footer>

</body>
</html>
