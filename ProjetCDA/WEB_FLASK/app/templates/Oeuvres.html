<!DOCTYPE html>
<html lang="fr">
    <head>
    
        <meta charset ="utf 8">
        <title>Oeuvres</title>
        <link class="icon" rel="icon" href="static/dophinicone.png" type="image/png">
        <link rel ="stylesheet" href ="{{ url_for ('static', filename='style2.css')}}">
    
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    </head>
<body background="static/Bibliotheque.jpeg">

    <!-- En-tête de la page -->
    <div class="entête">
        <h1>Oeuvres</h1>
        <div class="user-info">
            <p>Nom: {{ username }}</p> 
            <p>Groupe: {{ groupe }}</p>
        </div>
     </div>

    
    <header>

        <nav>
            <ul>
                <li><a class="text" href="{{ url_for('Home') }}">Accueil</a></li>
                <li><a class="text" href="{{ url_for('personnages') }}">Personnages</a></li>
                <li>
                    <button class="déco" onclick="window.location.href='{{ url_for('déconnexion') }}'">Déconnexion</button>
                </li>
            </ul>
        </nav>
        
        
    </header>

    <!-- Section principale -->
     
    <main>
        <figure>
            {% for fig in figs %}
            <img class="effigie" src="{{ url_for('get_photoOeuvres', id=fig.id) }}">
            <figcaption class="text" >{{ fig.Nom }}</figcaption>
            {% endfor %}
        </figure>
        
       
    </main>

    <!-- Pied de page -->
    <footer class="fs" >
        <p class="text">&copy; <img src="static/dophin.png"> 2024 Philorama. Tous droits réservés.</p>
    </footer>

</body>
</html>
