<!DOCTYPE html>
<html lang="fr">
<head>
    
    <meta charset ="utf 8">
    <title>Personnages</title>
    <link class="icon" rel="icon" href="static/dophinicone.png" type="image/png">
    <link rel ="stylesheet" href ="{{ url_for ('static', filename='css/style2.css')}}">
    <link rel ="stylesheet" href ="{{ url_for ('static', filename='css/bandes.css')}}">
    


    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body background="static/photo/arrière personnage.jpeg" >

    <header>
        <!-- En-tête de la page -->
        <div class="entête">
            <h1>Personnages</h1>
            <div class="user-info">
                <p>Nom: {{ username }}</p> 
                <p>Groupe: {{ groupe }}</p>
            </div>
        </div>
        

        <nav>
            <ul>
                <li><a class="text" href="{{ url_for('Home') }}">Accueil</a></li>
                <li><a class="text" href="{{ url_for('Oeuvres') }}">Oeuvres</a></li>
                <!-- Condition pour afficher "Enregistrement" uniquement si l'utilisateur est Admin -->
                {% if session['groupe'] == 'Admin' %}
                <li><a class="text" href="{{ url_for('Page_chargement') }}">Enregistrement</a></li>
                {% endif %}
                <li>
                    <button class="déco" onclick="window.location.href='{{ url_for('déconnexion') }}'">Déconnexion</button>
                </li>
            </ul>
        </nav>
        
    </header>

    <!-- Section principale -->
     
    <main class="container">
        

        {% for item in items %}
            <figure>
                {% if session['groupe'] == 'Admin' %}
                <!-- Ajout de la croix pour supprimer l'élément -->
                <form action="{{ url_for('delete_item', id=item.id_author) }}" method="POST" style="display: inline;">
                    <button type="submit" style="border:none; background:none; cursor:pointer;">
                        <img class="icon" src="{{ url_for('static', filename='croix.png') }}">
                    </button>
                </form>

                <div class="dropdown">
                    <label for="menu-toggle">
                        <img class="icon" src="{{ url_for('static', filename='bandes.png') }}" alt="Menu">
                    </label>
                    <input type="checkbox" id="menu-toggle">
                    <ul class="dropdown-menu">
                        <li><a href="#">Supprimer</a></li>
                        <li><a href="#">Commenter</a></li>
                        <li><a href="#">Modifier</a></li>
                    </ul>
                </div>
                {% endif %}

                <img class="effigie" src="{{ url_for('get_photo', id=item.id_author) }}">
                <figcaption class="text" >{{ item.name }} {{ item.birth }}-{{ item.dead }}</figcaption>
                <audio controls>
                    <source src="{{ url_for('get_audio', id=item.id_author) }}" type="audio/mpeg">
                    Votre navigateur ne supporte pas la lecture de ce fichier audio.
                </audio>
            </figure>
        {% endfor %}

        
    </main>
    <!-- Pied de page -->
    <footer >
        <p>&copy; <img src="static/photo/dauphin.png"> 2024 Philorama. Tous droits réservés.</p>
    </footer>
    

</body>
</html>
